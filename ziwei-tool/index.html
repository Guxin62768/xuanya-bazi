<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玄曜 · 紫微斗數命盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-grain"></div>

<header class="site-header">
  <div class="header-inner">
    <h1 class="logo">玄曜<span>紫微斗數</span></h1>
    <p class="tagline">安星 · 排盤 · 觀命</p>
  </div>
</header>

<main class="app">

  <!-- 輸入區 -->
  <section class="panel input-panel">
    <h2 class="panel-title">排盤輸入</h2>
    <div class="solar-box">
      <div class="solar-label">公曆生日（自動轉農曆）</div>
      <div class="solar-grid">
        <label class="field"><span>年</span><input id="sy" type="number" min="1900" max="2100" value="1968"></label>
        <label class="field"><span>月</span><input id="sm" type="number" min="1" max="12" value="5"></label>
        <label class="field"><span>日</span><input id="sd" type="number" min="1" max="31" value="28"></label>
        <label class="field"><span>時</span>
          <select id="sh">
            <option value="0">子時 23-01</option><option value="1">丑時 01-03</option>
            <option value="2">寅時 03-05</option><option value="3">卯時 05-07</option>
            <option value="4">辰時 07-09</option><option value="5">巳時 09-11</option>
            <option value="6">午時 11-13</option><option value="7">未時 13-15</option>
            <option value="8">申時 15-17</option><option value="9">酉時 17-19</option>
            <option value="10">戌時 19-21</option><option value="11" selected>亥時 21-23</option>
          </select>
        </label>
        <button id="solarBtn" class="calc-btn auto-ly" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
          <span>公曆轉農曆排盤</span>
        </button>
      </div>
    </div>
    <h2 class="panel-title sub">或手動填（自動推算或手選）</h2>
    <div class="form-grid">
      <label class="field">
        <span>年干</span>
        <select id="yearGan">
          <option value="甲">甲</option><option value="乙">乙</option>
          <option value="丙">丙</option><option value="丁">丁</option>
          <option value="戊" selected>戊</option><option value="己">己</option>
          <option value="庚">庚</option><option value="辛">辛</option>
          <option value="壬">壬</option><option value="癸">癸</option>
        </select>
      </label>
      <label class="field">
        <span>年支</span>
        <select id="yearZhi">
          <option value="子">子</option><option value="丑">丑</option>
          <option value="寅">寅</option><option value="卯">卯</option>
          <option value="辰">辰</option><option value="巳">巳</option>
          <option value="午">午</option><option value="未">未</option>
          <option value="申" selected>申</option><option value="酉">酉</option>
          <option value="戌">戌</option><option value="亥">亥</option>
        </select>
      </label>
      <label class="field">
        <span>農曆生月</span>
        <select id="month" name="month">
          <option value="1">正月</option><option value="2">二月</option>
          <option value="3">三月</option><option value="4">四月</option>
          <option value="5" selected>五月</option><option value="6">六月</option>
          <option value="7">七月</option><option value="8">八月</option>
          <option value="9">九月</option><option value="10">十月</option>
          <option value="11">十一月</option><option value="12">十二月</option>
        </select>
      </label>
      <label class="field">
        <span>生時</span>
        <select id="hour">
          <option value="0">子時 23-01</option><option value="1">丑時 01-03</option>
          <option value="2">寅時 03-05</option><option value="3">卯時 05-07</option>
          <option value="4">辰時 07-09</option><option value="5">巳時 09-11</option>
          <option value="6">午時 11-13</option><option value="7">未時 13-15</option>
          <option value="8">申時 15-17</option><option value="9">酉時 17-19</option>
          <option value="10">戌時 19-21</option><option value="11" selected>亥時 21-23</option>
        </select>
      </label>
      <label class="field">
        <span>農曆生日</span>
        <input id="day" type="number" min="1" max="30" value="2">
      </label>
      <label class="field">
        <span>五行局（自動推算或手選）</span>
        <select id="ju">
          <option value="水二">水二局</option><option value="木三">木三局</option>
          <option value="金四">金四局</option><option value="土五">土五局</option>
          <option value="火六" selected>火六局</option>
        </select>
      </label>
      <label class="field">
        <span>性別（定大限順逆）</span>
        <select id="gender">
          <option value="男" selected>男</option>
          <option value="女">女</option>
        </select>
      </label>
      <button id="calcBtn" class="calc-btn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.1 6.2H20l-5 4 2 6-5-3.5L7 18l2-6-5-4h5.9z"/></svg>
        <span>安星排盤</span>
      </button>
    </div>
  </section>

  <!-- 命盤 -->
  <section class="panel chart-panel" id="chartPanel" style="display:none">
    <div class="chart-head">
      <span class="tian"><span id="tianLabel">紫微在午</span></span>
      <span class="center-star" ><span id="ziweiLabel">紫微 午</span></span>
      <button id="exportBtn" class="export-btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        <span>存圖片</span>
      </button>
    </div>
    <div class="chart-wrap">
      <div class="chart" id="chart"></div>
    </div>
    <div class="legend">
      <span class="lg lg-ziwei">紫微星系</span>
      <span class="lg lg-tianfu">天府星系</span>
      <span class="lg lg-4h">四化標記</span>
      <span class="lg lg-aux">命身宮</span>
      <span class="lg lg-aux2">六吉星</span>
      <span class="lg lg-sha">六煞星</span>
      <span class="lg lg-ly">流年太歲宮</span>
      <span class="lg lg-xx">小限宮</span>
    </div>
  </section>

  <section class="panel info-panel" id="infoPanel" style="display:none">
    <h2 class="panel-title">命盤資訊</h2>
    <div id="infoGrid" class="info-grid"></div>
    <div class="duanyu-block" id="duanyuBlock" style="display:none">
      <div class="duanyu-title">命宮主星參考</div>
      <div id="duanyuList" class="duanyu-list"></div>
    </div>
  </section>

  <section class="panel sanfang-panel" id="sanfangPanel" style="display:none">
    <h2 class="panel-title">三方四正（看盤精髓）</h2>
    <p class="sf-desc">以命宮為核心，綜合對宮（遷移）+ 三合（財帛、官祿）四宮星曜，觀一生格局</p>
    <div id="sanfangGrid" class="sanfang-grid"></div>
  </section>

  <section class="panel shier-panel" id="shierPanel" style="display:none">
    <h2 class="panel-title">十二宮評析</h2>
    <div id="shierGrid" class="shier-grid"></div>
  </section>

  <section class="panel daxian-panel" id="daxianPanel" style="display:none">
    <h2 class="panel-title">大限列表</h2>
    <p class="daxian-desc" id="daxianDesc"></p>
    <div id="daxianList" class="daxian-grid"></div>
  </section>

  <section class="panel liunian-panel" id="liunianPanel" style="display:none">
    <h2 class="panel-title">流年 · 小限</h2>
    <div class="form-grid liunian-form">
      <label class="field">
        <span>流年干</span>
        <select id="lyGan">
          <option value="甲">甲</option><option value="乙">乙</option><option value="丙">丙</option>
          <option value="丁">丁</option><option value="戊">戊</option><option value="己">己</option>
          <option value="庚">庚</option><option value="辛">辛</option><option value="壬" selected>壬</option>
          <option value="癸">癸</option>
        </select>
      </label>
      <label class="field">
        <span>流年支</span>
        <select id="lyZhi">
          <option value="子">子</option><option value="丑">丑</option><option value="寅">寅</option>
          <option value="卯">卯</option><option value="辰">辰</option><option value="巳">巳</option>
          <option value="午" selected>午</option><option value="未">未</option><option value="申">申</option>
          <option value="酉">酉</option><option value="戌">戌</option><option value="亥">亥</option>
        </select>
      </label>
      <label class="field">
        <span>當前虛歲</span>
        <input id="age" type="number" min="1" max="150" value="30">
      </label>
      <button id="autoLyBtn" class="calc-btn auto-ly" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        <span>自動推流年</span>
      </button>
      <div class="liunian-result" id="liunianResult"></div>
      <div class="shensha-block">
        <div class="shensha-title">流年十二神煞</div>
        <div class="shensha-grid" id="shenshaGrid"></div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">
  <p>文化娛樂參考 · 命理排盤由玄曜引擎計算</p>
</footer>

<script src="libs/lunar.js"></script>
<script src="script.js"></script>
</body>
</html>
